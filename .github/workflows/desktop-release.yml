name: desktop release

# Run by hand: Actions → desktop release → Run workflow, or `gh workflow run desktop-release.yml`.
# Builds Verticals.app from the chosen branch and leaves a draft release v<version> with Verticals.zip
# (what the app downloads to update itself), Verticals-lite.zip (the same without the runtime, for an
# app that already has it), release.json (the macOS it needs and the runtime's fingerprint) and
# Verticals.dmg (first install). Its text starts from the merged PRs' titles: edit it on GitHub and
# publish it; apps see the release only then.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.4. Empty bumps the last number of the latest release.
        required: false

permissions:
  contents: write

concurrency: desktop-release

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - name: Version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          if [ -z "$version" ]; then
            last=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo v0.2)
            last="${last#v}"
            version="${last%.*}.$(( ${last##*.} + 1 ))"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Not a version: $version"; exit 1; }
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "v$version"; then
            echo "::error::v$version exists already, published or as a draft"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tools
        run: |
          brew install postgresql@16 uv
          uv python install 3.12

      - name: UI
        run: |
          npm ci --prefix web
          VITE_VERTICALS_TOKEN= npm --prefix web run build -- --outDir ../desktop/build/web --emptyOutDir

      - name: App
        run: python3 desktop/macos/bundle.py --version "$VERSION"

      - name: Upgrade check
        run: |
          if gh release view >/dev/null 2>&1; then
            gh release download --pattern Verticals.zip --dir previous
            ditto -x -k previous/Verticals.zip previous
            python3 desktop/macos/upgrade_check.py previous/Verticals.app desktop/dist/Verticals.app
            python3 desktop/macos/lite_check.py previous/Verticals.app desktop/dist/Verticals-lite.zip
          else
            echo "::notice::No earlier release to upgrade from"
          fi

      - name: Release text
        run: |
          python3 - <<'EOF'
          import json, os, plistlib, re, subprocess
          version = os.environ["VERSION"]
          plist = plistlib.load(open("desktop/dist/Verticals.app/Contents/Info.plist", "rb"))
          runtime = open("desktop/dist/Verticals.app/Contents/Resources/RUNTIME").read().strip()
          json.dump({"version": version, "min_macos": plist["LSMinimumSystemVersion"], "runtime": runtime},
                    open("desktop/dist/release.json", "w"), indent=2)
          generated = subprocess.run(["gh", "api", f"repos/{os.environ['GH_REPO']}/releases/generate-notes",
                                      "-f", f"tag_name=v{version}", "-f", f"target_commitish={os.environ['GITHUB_SHA']}",
                                      "--jq", ".body"], check=True, capture_output=True, text=True).stdout
          # The merged PRs' titles, without their authors, links and type prefixes: a start for the person.
          notes, section = [], ""
          for line in generated.splitlines():
              if line.startswith("#"):
                  section = line
              elif "New Contributors" not in section and (m := re.match(r"\* (.+?)(?: by @\S+)?(?: in https://\S+)?$", line)):
                  title = re.sub(r"^\w+(\([^)]*\))?!?:\s*", "", m.group(1))
                  notes.append(f"- {title[:1].upper()}{title[1:]}")
          open("desktop/dist/notes.md", "w").write(
              "<!-- Verticals shows a line written above the list beside its Update button: what got better, in a\n"
              "few words. Without it the update installs at quit without a word. The list is what the card shows. -->\n\n"
              + "\n".join(notes) + "\n")
          EOF

      - name: Release
        run: |
          gh release create "v$VERSION" desktop/dist/Verticals.zip desktop/dist/Verticals-lite.zip \
            desktop/dist/release.json desktop/dist/Verticals.dmg \
            --draft --target "$GITHUB_SHA" --title "Verticals $VERSION" --notes-file desktop/dist/notes.md
          echo "::notice::Draft v$VERSION is ready: write its text on GitHub and publish it"
